name: Build and Release DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example 1.7.0 or v1.7.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-release-dmg:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve release version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Use a version like 1.7.0 or v1.7.0."
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Import signing certificate
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERTIFICATE_P12:-}" ]; then
            echo "MACOS_CERTIFICATE_P12 is not set; building unsigned DMG."
            exit 0
          fi
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build app
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "${DEVELOPMENT_TEAM:-}" ]; then
            xcodebuild \
              -project QuickRecorder.xcodeproj \
              -scheme QuickRecorder \
              -configuration Release \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath build/DerivedData \
              MARKETING_VERSION="$VERSION" \
              DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
              build
          else
            xcodebuild \
              -project QuickRecorder.xcodeproj \
              -scheme QuickRecorder \
              -configuration Release \
              -destination 'platform=macOS,arch=arm64' \
              -derivedDataPath build/DerivedData \
              MARKETING_VERSION="$VERSION" \
              CODE_SIGNING_ALLOWED=NO \
              build
          fi

      - name: Create DMG
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release/QuickRecorder.app"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Contents/Info.plist")
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "Built app version $APP_VERSION does not match release version $VERSION."
            exit 1
          fi
          DMG_PATH="QuickRecorder_v${VERSION}.dmg"
          mkdir -p build/dmg-root
          cp -R "$APP_PATH" build/dmg-root/
          ln -s /Applications build/dmg-root/Applications
          hdiutil create \
            -volname "QuickRecorder" \
            -srcfolder build/dmg-root \
            -ov \
            -format UDZO \
            "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$DMG_PATH" --clobber
          else
            gh release create "$RELEASE_TAG" "$DMG_PATH" \
              --title "QuickRecorder $RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --generate-notes
          fi
